name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version
        id: ver
        run: |
          git fetch --tags --force
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
            if [[ -z "$tag" ]]; then
              last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
              if [[ "$last" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              else
                tag="v0.1.0"
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Go's module and build cache, as CI on main last saved it (a tag's own cache
      # could not be reused by the next tag).
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version "${{ steps.ver.outputs.version }}" -Release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" bin/ops-server-linux-amd64 bin/ops-server-linux-arm64 bin/SHA256SUMS --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      # Keep the release list short: only the newest 5 releases stay (their git tags remain).
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --exclude-drafts --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[5:][] | .tagName' |
            while read -r tag; do gh release delete "$tag" -y; done
