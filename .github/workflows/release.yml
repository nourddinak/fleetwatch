name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version ("${{ github.ref_name }}".TrimStart("v")) -Release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/ops-server-linux-amd64 bin/ops-server-linux-arm64 bin/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
